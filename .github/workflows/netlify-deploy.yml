name: Verify CI + Manual Netlify Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_message:
        description: "部署说明（可选）"
        required: false
        default: "manual deploy from GitHub"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install verification browser
        run: npx playwright-core install --with-deps chromium

      - name: Verify release
        env:
          HTML_CHUNK_DELAY_MS: "15"
        run: npm run check:release

      - name: Retain verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-release-checks
          path: .openai/validation-report.json
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build before deploy
        run: npm run build

      - name: Deploy to Netlify (manual)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DEPLOY_MESSAGE: ${{ github.event.inputs.deploy_message }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Missing NETLIFY_AUTH_TOKEN or NETLIFY_SITE_ID"
            exit 1
          fi
          npx netlify-cli deploy --auth "$NETLIFY_AUTH_TOKEN" --site "$NETLIFY_SITE_ID" --dir=out --prod --message "$DEPLOY_MESSAGE"
