name: Verify and Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install verification browser
        run: npx playwright-core install --with-deps chromium

      - name: Verify release under /game
        env:
          GITHUB_PAGES: "true"
          TEST_BASE_PATH: "/game"
          HTML_CHUNK_DELAY_MS: "15"
        run: npm run check:release

      - name: Retain verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-pages-release-checks
          path: .openai/validation-report.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
