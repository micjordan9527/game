<svg xmlns="http://www.w3.org/2000/svg" width="864" height="1821" viewBox="0 0 864 1821" role="img" aria-labelledby="title desc">
  <title id="title">博彩后台功能模块地图</title>
  <desc id="desc">从账号权限、会员代理、钱包支付、游戏注单、活动运营、数据风控理解后台系统的长信息图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="0.43" stop-color="#f7f2ff"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#f8fbff" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#d7e7ff"/>
      <stop offset="1" stop-color="#6f8cff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#efe5ff"/>
      <stop offset="1" stop-color="#b79cff"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1734"/>
      <stop offset="1" stop-color="#1f2f60"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#365b96" flood-opacity="0.13"/>
    </filter>
    <filter id="iconShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#243b75" flood-opacity="0.18"/>
    </filter>
    <style>
      .font { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .eyebrow { fill: #6b77b8; font-size: 22px; font-weight: 700; letter-spacing: 2px; }
      .title { fill: #07142e; font-size: 58px; font-weight: 800; letter-spacing: -1px; }
      .subtitle { fill: #536079; font-size: 25px; font-weight: 500; }
      .section-title { fill: #0b1734; font-size: 30px; font-weight: 760; }
      .body { fill: #586174; font-size: 21px; font-weight: 520; }
      .small { fill: #667085; font-size: 18px; font-weight: 520; }
      .num { fill: #ffffff; font-size: 20px; font-weight: 800; }
      .label { fill: #111c3a; font-size: 20px; font-weight: 700; }
    </style>
  </defs>

  <rect width="864" height="1821" fill="url(#bg)"/>
  <circle cx="744" cy="128" r="170" fill="#dce9ff" opacity="0.55"/>
  <circle cx="86" cy="506" r="190" fill="#efe4ff" opacity="0.62"/>
  <circle cx="736" cy="1478" r="220" fill="#e7f4ff" opacity="0.72"/>

  <g class="font">
    <text x="72" y="102" class="eyebrow">W-GAMING KNOWLEDGE</text>
    <text x="72" y="180" class="title">博彩后台功能模块地图</text>
    <text x="72" y="228" class="subtitle">从账号权限、会员代理、钱包支付、游戏注单、</text>
    <text x="72" y="263" class="subtitle">活动运营、数据风控理解后台系统</text>

    <g filter="url(#softShadow)">
      <rect x="72" y="326" width="720" height="148" rx="34" fill="url(#card)" stroke="#ffffff" stroke-width="2"/>
      <g filter="url(#iconShadow)">
        <rect x="108" y="362" width="76" height="76" rx="24" fill="url(#ink)"/>
        <path d="M136 410 h30 a8 8 0 0 0 8 -8 v-18 a8 8 0 0 0 -8 -8 h-40 a8 8 0 0 0 -8 8 v18 a8 8 0 0 0 8 8 h4 v14z" fill="#dce9ff"/>
      </g>
      <text x="214" y="387" class="section-title">后台不是一个页面，而是一组可审计的业务控制台</text>
      <text x="214" y="426" class="body">核心目标：权限清楚、状态可追踪、资金可对账、异常可复盘。</text>
    </g>

    <path d="M432 498 V1574" stroke="#c9d7f2" stroke-width="4" stroke-dasharray="10 14"/>

    <g filter="url(#softShadow)">
      <rect x="72" y="535" width="720" height="154" rx="30" fill="url(#card)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="132" cy="612" r="31" fill="url(#blue)"/>
      <text x="125" y="620" class="num">01</text>
      <text x="188" y="592" class="section-title">账号与权限</text>
      <text x="188" y="632" class="body">管理员账号 · 角色权限 · 审批记录 · 操作日志</text>
      <text x="188" y="666" class="small">先定义谁能看、谁能改、谁需要审批，避免高权限混用。</text>
      <g transform="translate(667 570)" filter="url(#iconShadow)">
        <rect width="68" height="68" rx="20" fill="url(#purple)"/>
        <path d="M20 35 l10 10 20 -24" fill="none" stroke="#1b2a58" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <g filter="url(#softShadow)">
      <rect x="72" y="724" width="720" height="154" rx="30" fill="url(#card)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="132" cy="801" r="31" fill="url(#purple)"/>
      <text x="125" y="809" class="num">02</text>
      <text x="188" y="781" class="section-title">会员与代理</text>
      <text x="188" y="821" class="body">会员资料 · 代理关系 · 数据可见范围 · 隐私边界</text>
      <text x="188" y="855" class="small">重点是关系管理和数据隔离，不是扩大权限或暴露隐私。</text>
      <g transform="translate(667 759)" filter="url(#iconShadow)">
        <rect width="68" height="68" rx="20" fill="url(#blue)"/>
        <circle cx="27" cy="28" r="9" fill="#10204a"/>
        <circle cx="45" cy="34" r="8" fill="#536dff"/>
        <path d="M17 50 c7 -13 25 -13 32 0" fill="none" stroke="#10204a" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>

    <g filter="url(#softShadow)">
      <rect x="72" y="913" width="720" height="154" rx="30" fill="url(#card)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="132" cy="990" r="31" fill="url(#blue)"/>
      <text x="125" y="998" class="num">03</text>
      <text x="188" y="970" class="section-title">钱包与支付</text>
      <text x="188" y="1010" class="body">中心钱包 · 免转钱包 · 充值订单 · 提现审核 · 财务对账</text>
      <text x="188" y="1044" class="small">资金链路必须有订单、回调、流水、对账和失败处理。</text>
      <g transform="translate(667 948)" filter="url(#iconShadow)">
        <rect width="68" height="68" rx="20" fill="url(#purple)"/>
        <rect x="16" y="23" width="38" height="27" rx="8" fill="#10204a"/>
        <circle cx="46" cy="37" r="4" fill="#cfe2ff"/>
      </g>
    </g>

    <g filter="url(#softShadow)">
      <rect x="72" y="1102" width="720" height="154" rx="30" fill="url(#card)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="132" cy="1179" r="31" fill="url(#purple)"/>
      <text x="125" y="1187" class="num">04</text>
      <text x="188" y="1159" class="section-title">游戏与注单</text>
      <text x="188" y="1199" class="body">厂商接口 · 游戏进入 · 注单状态 · 结算记录 · 异常补偿</text>
      <text x="188" y="1233" class="small">注单生命周期要能从创建、确认、结算追到每个状态。</text>
      <g transform="translate(667 1137)" filter="url(#iconShadow)">
        <rect width="68" height="68" rx="20" fill="url(#blue)"/>
        <rect x="17" y="18" width="34" height="42" rx="8" fill="#10204a"/>
        <path d="M25 30 h18 M25 40 h18 M25 50 h12" stroke="#dce9ff" stroke-width="4" stroke-linecap="round"/>
      </g>
    </g>

    <g filter="url(#softShadow)">
      <rect x="72" y="1291" width="720" height="154" rx="30" fill="url(#card)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="132" cy="1368" r="31" fill="url(#blue)"/>
      <text x="125" y="1376" class="num">05</text>
      <text x="188" y="1348" class="section-title">活动与运营</text>
      <text x="188" y="1388" class="body">活动配置 · 奖励记录 · 客服协作 · 用户通知</text>
      <text x="188" y="1422" class="small">活动规则要和后台配置、客服口径、报表统计保持一致。</text>
      <g transform="translate(667 1326)" filter="url(#iconShadow)">
        <rect width="68" height="68" rx="20" fill="url(#purple)"/>
        <path d="M20 45 h28 l-5 -24 h-18z" fill="#10204a"/>
        <path d="M27 29 c4 -10 18 -10 22 0" fill="none" stroke="#10204a" stroke-width="5" stroke-linecap="round"/>
      </g>
    </g>

    <g filter="url(#softShadow)">
      <rect x="72" y="1480" width="720" height="154" rx="30" fill="url(#card)" stroke="#ffffff" stroke-width="2"/>
      <circle cx="132" cy="1557" r="31" fill="url(#purple)"/>
      <text x="125" y="1565" class="num">06</text>
      <text x="188" y="1537" class="section-title">数据与风控</text>
      <text x="188" y="1577" class="body">数据报表 · 异常监控 · 风控规则 · 人工复核 · 事故复盘</text>
      <text x="188" y="1611" class="small">用数据发现问题，用复核降低误伤，用复盘改进流程。</text>
      <g transform="translate(667 1515)" filter="url(#iconShadow)">
        <rect width="68" height="68" rx="20" fill="url(#blue)"/>
        <path d="M20 45 v-15 M34 45 v-25 M48 45 v-34" stroke="#10204a" stroke-width="7" stroke-linecap="round"/>
      </g>
    </g>

    <g filter="url(#softShadow)">
      <rect x="72" y="1682" width="720" height="90" rx="28" fill="#0b1734" opacity="0.94"/>
      <text x="104" y="1724" fill="#ffffff" font-size="23" font-weight="760">检查重点</text>
      <text x="104" y="1758" fill="#d9e4ff" font-size="19" font-weight="540">权限分级 · 状态可追踪 · 资金可对账 · 异常可复盘 · 敏感操作有审批</text>
    </g>
  </g>
</svg>
