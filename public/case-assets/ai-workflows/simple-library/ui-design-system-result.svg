<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1260" viewBox="0 0 960 1260" role="img" aria-labelledby="title desc">
  <title id="title">UI 设计系统生成结果</title>
  <desc id="desc">根据参考风格生成的设计系统展示图，包含色彩、字体、图标、按钮、卡片、表单、导航、标签和滑杆。</desc>
  <defs>
    <linearGradient id="top" x1="0" x2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#fff7f0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#172033" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="960" height="1260" rx="36" fill="#fff"/>
  <rect width="960" height="310" rx="36" fill="url(#top)"/>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <text x="56" y="78" fill="#ff6b00" font-size="12" font-weight="700" letter-spacing="3">DESIGN SYSTEM</text>
    <text x="56" y="126" fill="#172033" font-size="38" font-weight="700">UI Design System</text>
    <text x="56" y="168" fill="#172033" font-size="21" font-weight="700">轻盈 · 高效 · 一致</text>
    <text x="56" y="206" fill="#667085" font-size="15">网页、移动端、卡片、控件、按钮与常用组件规范。</text>
    <g transform="translate(610 66)" filter="url(#shadow)">
      <path d="M18 162 L206 108 L206 220 L18 276 Z" fill="#3b2b24" opacity=".95"/>
      <rect x="58" y="10" width="170" height="110" rx="8" fill="#fff" stroke="#2c211d" stroke-width="7" transform="rotate(11 143 65)"/>
      <text x="102" y="66" fill="#172033" font-size="15" font-weight="700" transform="rotate(11 143 65)">PLAY</text>
      <text x="102" y="86" fill="#ff6b00" font-size="15" font-weight="700" transform="rotate(11 143 65)">MORE</text>
      <path d="M248 10 C268 14 280 26 288 42" fill="none" stroke="#ff6b00" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>
  <g font-family="Arial, 'PingFang SC', sans-serif" transform="translate(44 330)">
    <rect width="872" height="870" rx="20" fill="#fff" stroke="#e4e7ec"/>
    <g transform="translate(36 44)">
      <text fill="#172033" font-size="14" font-weight="700">01  Colors / 色彩</text>
      <g transform="translate(0 38)">
        <circle cx="24" cy="24" r="22" fill="#ff6b00"/>
        <circle cx="104" cy="24" r="22" fill="#172033"/>
        <circle cx="184" cy="24" r="22" fill="#667085"/>
        <circle cx="264" cy="24" r="22" fill="#e4e7ec"/>
        <circle cx="344" cy="24" r="22" fill="#f7f8fa" stroke="#e4e7ec"/>
        <circle cx="424" cy="24" r="22" fill="#fff" stroke="#e4e7ec"/>
      </g>
      <text x="470" y="0" fill="#172033" font-size="14" font-weight="700">02  Typography / 字体</text>
      <text x="470" y="58" fill="#172033" font-size="38" font-weight="700">Aa</text>
      <text x="532" y="45" fill="#667085" font-size="13">Display / Semi Bold</text>
      <text x="532" y="72" fill="#667085" font-size="13">Body / Regular</text>
      <text x="640" y="0" fill="#172033" font-size="14" font-weight="700">03  Icons / 图标</text>
      <g transform="translate(640 32)" fill="none" stroke="#667085" stroke-width="2">
        <rect width="18" height="18" rx="4"/><circle cx="52" cy="9" r="9"/><path d="M88 0 L106 18 M106 0 L88 18"/><path d="M136 18 V0 H154"/>
        <rect y="40" width="18" height="18" rx="9"/><path d="M43 49 H61 M52 40 V58"/><path d="M88 40 H106 V58 H88 Z"/><path d="M136 49 H154"/>
      </g>
    </g>
    <line x1="36" y1="190" x2="836" y2="190" stroke="#e4e7ec"/>
    <g transform="translate(36 230)" font-size="14">
      <text fill="#172033" font-weight="700">04  Buttons / 按钮</text>
      <g transform="translate(0 42)">
        <text fill="#667085" y="18">Default</text><rect x="96" y="0" width="128" height="28" rx="14" fill="#ff6b00"/><text x="136" y="19" fill="#fff" font-size="12" font-weight="700">主要按钮</text>
        <text fill="#667085" y="62">Hover</text><rect x="96" y="44" width="128" height="28" rx="14" fill="#ff7f22"/><text x="136" y="63" fill="#fff" font-size="12" font-weight="700">主要按钮</text>
        <text fill="#667085" y="106">Disabled</text><rect x="96" y="88" width="128" height="28" rx="14" fill="#ffe3cc"/><text x="136" y="107" fill="#ff9a55" font-size="12" font-weight="700">主要按钮</text>
      </g>
      <g transform="translate(292 42)">
        <text fill="#667085" y="18">Default</text><rect x="96" y="0" width="128" height="28" rx="14" fill="#fff" stroke="#ff6b00"/><text x="136" y="19" fill="#ff6b00" font-size="12" font-weight="700">次级按钮</text>
        <text fill="#667085" y="62">Hover</text><rect x="96" y="44" width="128" height="28" rx="14" fill="#fff7ed" stroke="#ff6b00"/><text x="136" y="63" fill="#ff6b00" font-size="12" font-weight="700">次级按钮</text>
        <text fill="#667085" y="106">Disabled</text><rect x="96" y="88" width="128" height="28" rx="14" fill="#fff" stroke="#ffe3cc"/><text x="136" y="107" fill="#ffb889" font-size="12" font-weight="700">次级按钮</text>
      </g>
      <g transform="translate(584 42)">
        <text fill="#667085" y="18">Success</text><rect x="96" y="0" width="150" height="28" rx="6" fill="#eef8f6"/><text x="126" y="19" fill="#167c72" font-size="12">操作成功</text>
        <text fill="#667085" y="62">Warning</text><rect x="96" y="44" width="150" height="28" rx="6" fill="#fff7ed"/><text x="126" y="63" fill="#c2410c" font-size="12">需要注意</text>
        <text fill="#667085" y="106">Info</text><rect x="96" y="88" width="150" height="28" rx="6" fill="#f1f6ff"/><text x="126" y="107" fill="#315ea8" font-size="12">信息提示</text>
      </g>
    </g>
    <line x1="36" y1="430" x2="836" y2="430" stroke="#e4e7ec"/>
    <g transform="translate(36 470)" font-size="14">
      <text fill="#172033" font-weight="700">05  Cards / 卡片</text>
      <g transform="translate(0 40)">
        <rect width="166" height="112" rx="10" fill="#fff" stroke="#e4e7ec"/>
        <circle cx="32" cy="32" r="14" fill="#fff7ed"/><rect x="22" y="58" width="72" height="10" rx="5" fill="#172033" opacity=".18"/><rect x="22" y="82" width="112" height="8" rx="4" fill="#e4e7ec"/>
        <rect x="192" width="166" height="112" rx="10" fill="#fff" stroke="#e4e7ec"/>
        <circle cx="224" cy="32" r="14" fill="#f1f6ff"/><rect x="214" y="58" width="72" height="10" rx="5" fill="#172033" opacity=".18"/><rect x="214" y="82" width="112" height="8" rx="4" fill="#e4e7ec"/>
        <rect x="384" width="166" height="112" rx="10" fill="#fff" stroke="#e4e7ec"/>
        <circle cx="416" cy="32" r="14" fill="#eef8f6"/><rect x="406" y="58" width="72" height="10" rx="5" fill="#172033" opacity=".18"/><rect x="406" y="82" width="112" height="8" rx="4" fill="#e4e7ec"/>
      </g>
      <text x="604" y="0" fill="#172033" font-weight="700">06  Form Controls / 表单</text>
      <rect x="604" y="40" width="220" height="32" rx="6" fill="#fff" stroke="#ff6b00"/>
      <rect x="604" y="92" width="150" height="28" rx="14" fill="#fff7ed"/>
      <circle cx="628" cy="106" r="7" fill="#ff6b00"/>
      <rect x="604" y="140" width="220" height="8" rx="4" fill="#ffe3cc"/><rect x="604" y="140" width="120" height="8" rx="4" fill="#ff6b00"/><circle cx="724" cy="144" r="12" fill="#ff6b00"/>
    </g>
    <line x1="36" y1="690" x2="836" y2="690" stroke="#e4e7ec"/>
    <g transform="translate(36 730)" font-size="14">
      <text fill="#172033" font-weight="700">07  Navigation / 导航</text>
      <rect x="0" y="40" width="500" height="42" rx="8" fill="#fff" stroke="#e4e7ec"/>
      <rect x="24" y="52" width="44" height="18" rx="9" fill="#ff6b00"/>
      <rect x="92" y="52" width="44" height="18" rx="9" fill="#f7f8fa"/>
      <rect x="160" y="52" width="44" height="18" rx="9" fill="#f7f8fa"/>
      <rect x="228" y="52" width="44" height="18" rx="9" fill="#f7f8fa"/>
      <text x="548" y="0" fill="#172033" font-weight="700">08  Tags / 标签</text>
      <rect x="548" y="40" width="52" height="24" rx="12" fill="#fff7ed"/><text x="563" y="57" fill="#ff6b00" font-size="12">Hot</text>
      <rect x="616" y="40" width="52" height="24" rx="12" fill="#eef8f6"/><text x="627" y="57" fill="#167c72" font-size="12">New</text>
      <rect x="684" y="40" width="52" height="24" rx="12" fill="#f1f6ff"/><text x="695" y="57" fill="#315ea8" font-size="12">Info</text>
    </g>
  </g>
</svg>
