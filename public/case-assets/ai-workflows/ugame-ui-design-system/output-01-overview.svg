<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">U.Game UI 设计系统总览</title>
  <desc id="desc">包含色彩、字体、页面示例和核心组件的 UI 设计系统总览。</desc>
  <rect width="1200" height="1600" fill="#fff"/>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <text x="62" y="72" fill="#1677ff" font-size="30" font-weight="700">U.Game</text>
    <text x="62" y="144" fill="#0f172a" font-size="54" font-weight="700">U.Game UI 设计系统</text>
    <text x="62" y="198" fill="#667085" font-size="24">网页端 / 移动端 / 组件规范</text>
    <g transform="translate(60 270)">
      <rect width="480" height="300" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="24" y="46" fill="#172033" font-size="22" font-weight="700">色彩体系</text>
      <rect x="24" y="82" width="70" height="70" rx="12" fill="#1677ff"/>
      <rect x="122" y="82" width="70" height="70" rx="12" fill="#5ba7ff"/>
      <rect x="220" y="82" width="70" height="70" rx="12" fill="#eaf2ff"/>
      <rect x="318" y="82" width="70" height="70" rx="12" fill="#0f172a"/>
      <rect x="24" y="192" width="54" height="54" rx="12" fill="#22c55e"/>
      <rect x="118" y="192" width="54" height="54" rx="12" fill="#f59e0b"/>
      <rect x="212" y="192" width="54" height="54" rx="12" fill="#ef4444"/>
      <rect x="306" y="192" width="54" height="54" rx="12" fill="#1677ff"/>
    </g>
    <g transform="translate(580 270)">
      <rect width="560" height="300" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="24" y="46" fill="#172033" font-size="22" font-weight="700">移动端页面示例</text>
      <rect x="28" y="82" width="112" height="184" rx="16" fill="#f7fbff" stroke="#d7e6ff"/>
      <rect x="164" y="82" width="112" height="184" rx="16" fill="#f7fbff" stroke="#d7e6ff"/>
      <rect x="300" y="82" width="112" height="184" rx="16" fill="#172033" opacity=".86"/>
      <rect x="436" y="82" width="96" height="184" rx="16" fill="#f7fbff" stroke="#d7e6ff"/>
    </g>
    <g transform="translate(60 610)">
      <rect width="480" height="260" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="24" y="46" fill="#172033" font-size="22" font-weight="700">字体规范</text>
      <text x="24" y="104" fill="#0f172a" font-size="26" font-weight="700">标题 1　28px / Bold</text>
      <text x="24" y="150" fill="#0f172a" font-size="22" font-weight="700">标题 2　22px / Bold</text>
      <text x="24" y="192" fill="#667085" font-size="18">正文　16px / Regular</text>
    </g>
    <g transform="translate(580 610)">
      <rect width="560" height="260" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="24" y="46" fill="#172033" font-size="22" font-weight="700">网页端页面示例</text>
      <rect x="24" y="78" width="512" height="148" rx="14" fill="#f7fbff"/>
      <rect x="58" y="112" width="310" height="62" rx="12" fill="#eaf2ff"/>
      <rect x="392" y="112" width="110" height="82" rx="12" fill="#fff"/>
    </g>
    <g transform="translate(60 910)">
      <rect width="1080" height="260" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="24" y="46" fill="#172033" font-size="22" font-weight="700">核心组件库</text>
      <rect x="24" y="88" width="250" height="124" rx="16" fill="#f7fbff" stroke="#e4e7ec"/>
      <rect x="304" y="88" width="250" height="124" rx="16" fill="#f7fbff" stroke="#e4e7ec"/>
      <rect x="584" y="88" width="220" height="124" rx="16" fill="#eaf2ff"/>
      <rect x="834" y="88" width="200" height="124" rx="16" fill="#1677ff"/>
    </g>
    <g transform="translate(60 1210)">
      <rect width="1080" height="250" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="24" y="46" fill="#172033" font-size="22" font-weight="700">按钮 / 标签 / 输入 / 底部导航</text>
      <rect x="24" y="88" width="140" height="42" rx="10" fill="#1677ff"/>
      <rect x="190" y="88" width="140" height="42" rx="10" fill="#fff" stroke="#1677ff"/>
      <rect x="370" y="88" width="220" height="42" rx="10" fill="#fff" stroke="#e4e7ec"/>
      <rect x="630" y="88" width="340" height="96" rx="18" fill="#f7fbff" stroke="#e4e7ec"/>
    </g>
  </g>
</svg>
