    <text x="60" y="210" fill="#667085" font-size="24">业务卡片 / 信息展示 / 列表模块</text>
    <g transform="translate(50 270)">
      <rect width="520" height="260" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="24" y="50" fill="#172033" font-size="24" font-weight="700">01 轮播 Hero 卡片</text>
      <rect x="36" y="90" width="110" height="130" rx="16" fill="#1677ff"/>
      <rect x="170" y="90" width="110" height="130" rx="16" fill="#2388ff"/>
      <rect x="304" y="90" width="110" height="130" rx="16" fill="#e4e7ec"/>
    </g>
    <g transform="translate(630 270)">
      <rect width="520" height="260" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="24" y="50" fill="#172033" font-size="24" font-weight="700">02 赛事卡片</text>
      <rect x="36" y="90" width="110" height="130" rx="16" fill="#fff" stroke="#d7e6ff"/>
      <rect x="170" y="90" width="110" height="130" rx="16" fill="#fff" stroke="#1677ff"/>
      <rect x="304" y="90" width="110" height="130" rx="16" fill="#f7fbff" stroke="#e4e7ec"/>
    </g>
    <g transform="translate(50 570)">
      <rect width="520" height="250" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="24" y="50" fill="#172033" font-size="24" font-weight="700">03 盘口小卡</text>
      <rect x="36" y="90" width="110" height="110" rx="16" fill="#fff" stroke="#d7e6ff"/>
      <rect x="170" y="90" width="110" height="110" rx="16" fill="#1677ff"/>
      <rect x="304" y="90" width="110" height="110" rx="16" fill="#e4e7ec"/>
    </g>
    <g transform="translate(630 570)">
      <rect width="520" height="250" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="24" y="50" fill="#172033" font-size="24" font-weight="700">04 钱包余额卡</text>
      <rect x="36" y="90" width="190" height="110" rx="18" fill="#1677ff"/>
      <rect x="260" y="90" width="190" height="110" rx="18" fill="#e4e7ec"/>
    </g>
    <g transform="translate(50 860)">
      <rect width="520" height="250" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="24" y="50" fill="#172033" font-size="24" font-weight="700">05 用户信息卡</text>
      <rect x="36" y="88" width="110" height="120" rx="16" fill="#fff" stroke="#d7e6ff"/>
      <rect x="170" y="88" width="110" height="120" rx="16" fill="#fff" stroke="#1677ff"/>
      <rect x="304" y="88" width="110" height="120" rx="16" fill="#f7fbff" stroke="#e4e7ec"/>
    </g>
    <g transform="translate(630 860)">
      <rect width="520" height="250" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="24" y="50" fill="#172033" font-size="24" font-weight="700">06 游戏大厅内容卡</text>
      <rect x="36" y="90" width="110" height="120" rx="16" fill="#f7fbff"/>
      <rect x="170" y="90" width="110" height="120" rx="16" fill="#fff7ed"/>
      <rect x="304" y="90" width="110" height="120" rx="16" fill="#eaf2ff"/>
