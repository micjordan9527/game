      <rect x="296" y="92" width="230" height="160" rx="16" fill="#fff7ed"/>
      <rect x="556" y="92" width="230" height="160" rx="16" fill="#eaf2ff"/>
      <rect x="816" y="92" width="230" height="160" rx="16" fill="#f7f8fa"/>
