    <rect x="420" y="388" width="902" height="118" rx="28" fill="#f4f4f5"/>
    <text x="452" y="438" fill="#172033" font-size="28">用这种风格帮我生成一套UI设计系统的图，包含网页、移动端、卡片、</text>
    <text x="452" y="482" fill="#172033" font-size="28">控件、按钮以及其它</text>
    <text x="32" y="620" fill="#8c8c8c" font-size="28">Thought for 3m 54s &gt;</text>
    <g transform="translate(36 676)">
