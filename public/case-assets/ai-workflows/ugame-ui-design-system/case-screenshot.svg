  <rect width="1400" height="900" fill="#fff"/>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <g transform="translate(840 58)">
      <rect x="0" y="0" width="168" height="136" rx="18" fill="#f7f8fa"/>
