<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">局部素材拆分</title>
  <desc id="desc">从整页视觉方向中拆出顶部 Banner、状态图标、空状态插画和卡片装饰素材。</desc>
  <defs>
    <linearGradient id="banner" x1="0" x2="1">
      <stop offset="0" stop-color="#eef8f6"/>
      <stop offset=".5" stop-color="#f1f6ff"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#f7f8fa"/>
  <text x="64" y="82" fill="#172033" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="700">Step 03 拆分局部素材</text>
  <text x="64" y="122" fill="#667085" font-family="Arial, 'PingFang SC', sans-serif" font-size="18">整页图负责定方向，局部素材单独生成，放回 Figma 组合。</text>
  <g font-family="Arial, 'PingFang SC', sans-serif">
    <rect x="64" y="172" width="1072" height="170" rx="22" fill="url(#banner)" stroke="#e4e7ec"/>
    <text x="104" y="226" fill="#172033" font-size="24" font-weight="700">Banner 背景素材</text>
    <path d="M850 274 C930 194 1040 194 1110 274" fill="none" stroke="#167c72" stroke-width="10" stroke-linecap="round" opacity=".28"/>
    <circle cx="976" cy="254" r="42" fill="#167c72" opacity=".13"/>
    <rect x="104" y="258" width="240" height="22" rx="11" fill="#fff" opacity=".72"/>
    <rect x="104" y="292" width="160" height="16" rx="8" fill="#fff" opacity=".72"/>
    <g transform="translate(64 392)">
      <rect width="318" height="210" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="28" y="44" fill="#172033" font-size="22" font-weight="700">状态图标</text>
      <g transform="translate(36 80)">
        <rect width="58" height="58" rx="16" fill="#eef8f6"/><circle cx="29" cy="29" r="14" fill="#167c72"/>
      </g>
      <g transform="translate(126 80)">
        <rect width="58" height="58" rx="16" fill="#f1f6ff"/><circle cx="29" cy="29" r="14" fill="#315ea8"/>
      </g>
      <g transform="translate(216 80)">
        <rect width="58" height="58" rx="16" fill="#fff7ed"/><circle cx="29" cy="29" r="14" fill="#c2410c"/>
      </g>
    </g>
    <g transform="translate(442 392)">
      <rect width="318" height="210" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="28" y="44" fill="#172033" font-size="22" font-weight="700">空状态插画</text>
      <rect x="70" y="88" width="178" height="78" rx="22" fill="#f1f6ff"/>
      <path d="M92 144 L148 108 L202 144" fill="none" stroke="#315ea8" stroke-width="8" stroke-linecap="round"/>
      <circle cx="222" cy="110" r="15" fill="#167c72" opacity=".7"/>
    </g>
    <g transform="translate(820 392)">
      <rect width="316" height="210" rx="18" fill="#fff" stroke="#e4e7ec"/>
      <text x="28" y="44" fill="#172033" font-size="22" font-weight="700">卡片装饰</text>
      <rect x="46" y="88" width="224" height="72" rx="16" fill="#eef8f6"/>
      <rect x="70" y="112" width="84" height="14" rx="7" fill="#167c72" opacity=".65"/>
      <rect x="70" y="138" width="146" height="10" rx="5" fill="#d7f0ea"/>
    </g>
  </g>
</svg>
